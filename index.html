<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>운동</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a2e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #6c5ce7);
    --btn: var(--tg-theme-button-color, #6c5ce7);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f5f3ff);
    --card-bg: #f8f7ff;
    --success: #00b894;
    --active: #6c5ce7;
    --rest: #fdcb6e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 100px 0;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    padding: 20px 20px 16px;
    text-align: center;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .header .subtitle {
    font-size: 14px;
    color: var(--hint);
  }
  .header .week-badge {
    display: inline-block;
    background: var(--active);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    margin-top: 8px;
  }

  /* Progress bar */
  .progress-container {
    padding: 0 20px 16px;
  }
  .progress-bar {
    background: var(--secondary-bg);
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
  }
  .progress-fill {
    background: linear-gradient(90deg, var(--active), var(--success));
    height: 100%;
    border-radius: 10px;
    transition: width 0.5s ease;
  }
  .progress-text {
    font-size: 12px;
    color: var(--hint);
    margin-top: 6px;
    text-align: right;
  }

  /* Exercise list */
  .exercise-list {
    padding: 0 16px;
  }
  .exercise-card {
    background: var(--secondary-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    transition: all 0.3s ease;
    border: 2px solid transparent;
  }
  .exercise-card.active {
    border-color: var(--active);
    background: #fff;
    box-shadow: 0 4px 20px rgba(108, 92, 231, 0.15);
  }
  .exercise-card.done {
    opacity: 0.6;
    background: var(--secondary-bg);
  }
  .exercise-card.done .card-title::after {
    content: ' ✓';
    color: var(--success);
    font-weight: bold;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .card-number {
    background: var(--active);
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .exercise-card.done .card-number {
    background: var(--success);
  }
  .card-meta {
    font-size: 12px;
    color: var(--hint);
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card-desc {
    font-size: 14px;
    color: var(--hint);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .card-info {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--hint);
  }

  /* Timer */
  .timer-section {
    text-align: center;
    margin-top: 12px;
  }
  .timer-display {
    font-size: 48px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--active);
    margin: 8px 0;
  }
  .timer-label {
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 12px;
  }
  .timer-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .timer-btn {
    padding: 10px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .timer-btn:active { transform: scale(0.95); }
  .btn-start {
    background: var(--active);
    color: #fff;
  }
  .btn-pause {
    background: var(--rest);
    color: #333;
  }
  .btn-skip {
    background: var(--secondary-bg);
    color: var(--hint);
  }
  .btn-next {
    background: var(--success);
    color: #fff;
  }

  /* Rest overlay */
  .rest-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .rest-overlay.show { display: flex; }
  .rest-text {
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .rest-timer {
    color: var(--rest);
    font-size: 64px;
    font-weight: 700;
  }
  .rest-skip {
    color: #fff;
    font-size: 14px;
    margin-top: 20px;
    opacity: 0.7;
    cursor: pointer;
    border: none;
    background: none;
  }

  /* Complete screen */
  .complete-screen {
    display: none;
    text-align: center;
    padding: 60px 24px;
  }
  .complete-screen.show { display: block; }
  .complete-emoji { font-size: 64px; margin-bottom: 16px; }
  .complete-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .complete-sub {
    font-size: 15px;
    color: var(--hint);
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .complete-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 30px;
  }
  .stat-item { text-align: center; }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--active);
  }
  .stat-label {
    font-size: 12px;
    color: var(--hint);
    margin-top: 2px;
  }
  .complete-btn {
    background: var(--btn);
    color: var(--btn-text);
    border: none;
    padding: 14px 32px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Rest day screen */
  .rest-day {
    text-align: center;
    padding: 80px 24px;
  }
  .rest-day-emoji { font-size: 64px; margin-bottom: 16px; }
  .rest-day-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .rest-day-sub { font-size: 15px; color: var(--hint); line-height: 1.6; }
</style>
</head>
<body>

<div id="app"></div>

<div class="rest-overlay" id="restOverlay">
  <div class="rest-text">잠시 쉬어가요</div>
  <div class="rest-timer" id="restTimer">15</div>
  <button class="rest-skip" onclick="skipRest()">건너뛰기</button>
</div>

<script>

const PROGRAMS = {"1":{"1":{"title":"부드러운 전신 스트레칭","description":"하루를 여는 가벼운 스트레칭으로 뭉친 몸을 풀어줘요","duration_minutes":15,"exercises":[{"name":"목 스트레칭","duration_seconds":60,"sets":1,"reps":null,"description":"고개를 천천히 좌우로 기울이고, 앞뒤로 숙여주세요","rest_seconds":10},{"name":"어깨 돌리기","duration_seconds":60,"sets":1,"reps":null,"description":"양 어깨를 크게 앞으로 10회, 뒤로 10회 돌려주세요","rest_seconds":10},{"name":"고양이-소 자세","duration_seconds":90,"sets":1,"reps":10,"description":"네발 자세에서 등을 둥글게 말았다가 오목하게 젖혀주세요","rest_seconds":10},{"name":"옆구리 스트레칭","duration_seconds":60,"sets":1,"reps":null,"description":"서서 한 팔을 위로 뻗고 반대쪽으로 천천히 기울여주세요. 좌우 30초씩","rest_seconds":10},{"name":"허벅지 뒤쪽 스트레칭","duration_seconds":60,"sets":1,"reps":null,"description":"앉아서 한 다리를 펴고 발끝을 향해 천천히 숙여주세요. 좌우 30초씩","rest_seconds":10},{"name":"나비 자세","duration_seconds":60,"sets":1,"reps":null,"description":"앉아서 발바닥을 모으고 무릎을 천천히 위아래로 움직여주세요","rest_seconds":10},{"name":"복식 호흡","duration_seconds":120,"sets":1,"reps":10,"description":"편하게 누워서 배에 손을 올리고, 코로 깊게 들이마시고 입으로 천천히 내쉬세요","rest_seconds":0}]},"2":{"title":"상체 이완 스트레칭","description":"아기 안느라 지친 어깨와 팔을 풀어줘요","duration_minutes":15,"exercises":[{"name":"손목 돌리기","duration_seconds":40,"sets":1,"reps":null,"description":"양손을 깍지 끼고 손목을 천천히 돌려주세요. 좌우 각 10회","rest_seconds":10},{"name":"가슴 열기 스트레칭","duration_seconds":60,"sets":1,"reps":null,"description":"양손을 등 뒤에서 깍지 끼고 가슴을 활짝 열어주세요. 30초 유지","rest_seconds":10},{"name":"팔 교차 스트레칭","duration_seconds":60,"sets":1,"reps":null,"description":"한 팔을 가슴 앞으로 쭉 뻗고 반대 손으로 당겨주세요. 좌우 30초씩","rest_seconds":10},{"name":"어깨 으쓱 & 이완","duration_seconds":60,"sets":1,"reps":10,"description":"어깨를 귀까지 올렸다가 힘을 빼고 툭 떨어뜨려주세요","rest_seconds":10},{"name":"상체 비틀기","duration_seconds":60,"sets":1,"reps":null,"description":"앉아서 한 손을 반대쪽 무릎에 대고 상체를 천천히 비틀어주세요. 좌우 30초씩","rest_seconds":10},{"name":"아기 자세 (차일드 포즈)","duration_seconds":90,"sets":1,"reps":null,"description":"무릎 꿇고 앞으로 팔을 쭉 뻗어 이마를 바닥에 대세요. 깊게 호흡하면서 90초 유지","rest_seconds":10},{"name":"목 좌우 스트레칭","duration_seconds // =============================================
// Program Data (inline for standalone use)
// =============================================
function getPrograms() {
  if (PROGRAMS) return PROGRAMS;
  // Fallback: generate from week/day
  return null;
}

// Determine current week (1-4 cycling) and day (1=Mon, 7=Sun)
function getCurrentWeekDay() {
  const now = new Date();
  // ISO week calculation
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  const week = ((weekNo - 1) % 4) + 1;
  const day = now.getDay() === 0 ? 7 : now.getDay(); // 1=Mon..7=Sun
  return { week, day };
}

// =============================================
// App State
// =============================================
let currentExerciseIndex = 0;
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;
let completedExercises = [];
let startTime = null;
let program = null;

// =============================================
// Initialize
// =============================================
function init() {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const { week, day } = getCurrentWeekDay();

  // Try to get program from URL params or embedded data
  const params = new URLSearchParams(window.location.search);
  let paramWeek = parseInt(params.get('week')) || week;
  let paramDay = parseInt(params.get('day')) || day;

  // Weekend: show next Monday's program as preview
  let isPreview = false;
  if (paramDay > 5 && !params.get('day')) {
    paramDay = 1;
    paramWeek = (week % 4) + 1;
    isPreview = true;
  }

  // Load program from embedded data
  // JSON keys are strings ("1", "2"), so convert numbers to strings for lookup
  const programs = getPrograms();
  const wk = String(paramWeek);
  const dy = String(paramDay);
  if (programs && programs[wk] && programs[wk][dy]) {
    program = programs[wk][dy];
    program.week = paramWeek;
    program.day = paramDay;
  } else {
    // Fallback: use hardcoded daily programs from fetch
    program = getFallbackProgram(paramWeek, paramDay);
  }

  if (!program) {
    // Should never happen — fallback always returns a program
    program = getFallbackProgram(paramWeek, paramDay);
  }

  startTime = Date.now();
  renderApp();
}

function getFallbackProgram(week, day) {
  // Minimal fallback programs
  const dayNames = { 1: '월', 2: '화', 3: '수', 4: '목', 5: '금' };
  return {
    week: week,
    day: day,
    title: `${week}주차 ${dayNames[day]}요일 운동`,
    description: '오늘의 운동을 시작해볼까요?',
    duration_minutes: 15,
    exercises: [
      { name: '스트레칭', duration_seconds: 120, sets: 1, reps: null, description: '전신을 부드럽게 풀어주세요', rest_seconds: 10 },
      { name: '스쿼트', duration_seconds: 90, sets: 2, reps: 10, description: '천천히 내려갔다 올라오세요', rest_seconds: 15 },
      { name: '브릿지', duration_seconds: 90, sets: 2, reps: 10, description: '엉덩이를 들어올려주세요', rest_seconds: 15 },
      { name: '플랭크', duration_seconds: 60, sets: 2, reps: null, description: '20초 유지해주세요', rest_seconds: 10 },
      { name: '쿨다운', duration_seconds: 120, sets: 1, reps: null, description: '깊은 호흡으로 마무리', rest_seconds: 0 },
    ]
  };
}

// =============================================
// Rendering
// =============================================
function renderApp() {
  const app = document.getElementById('app');
  const totalExercises = program.exercises.length;
  const progressPct = (completedExercises.length / totalExercises) * 100;
  const weekNames = { 1: '기초 회복', 2: '코어 활성화', 3: '근력 강화', 4: '전신 통합' };

  let html = `
    <div class="header">
      <h1>${program.title}</h1>
      <div class="subtitle">${program.description}</div>
      <div class="week-badge">${isPreview ? '미리보기 · ' : ''}${program.week}주차 · ${weekNames[program.week] || ''}</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" style="width:${progressPct}%"></div>
      </div>
      <div class="progress-text">${completedExercises.length} / ${totalExercises}</div>
    </div>

    <div class="exercise-list">
  `;

  program.exercises.forEach((ex, i) => {
    const isDone = completedExercises.includes(i);
    const isActive = i === currentExerciseIndex && !isDone;
    const cls = isDone ? 'done' : isActive ? 'active' : '';
    const metaInfo = [];
    if (ex.sets > 1) metaInfo.push(`${ex.sets}세트`);
    if (ex.reps) metaInfo.push(`${ex.reps}회`);
    metaInfo.push(`${ex.duration_seconds}초`);

    html += `
      <div class="exercise-card ${cls}" id="card-${i}" onclick="selectExercise(${i})">
        <div class="card-top">
          <div class="card-number">${isDone ? '✓' : i + 1}</div>
          <div class="card-meta">${metaInfo.join(' · ')}</div>
        </div>
        <div class="card-title">${ex.name}</div>
        <div class="card-desc">${ex.description}</div>
    `;

    if (isActive) {
      html += renderTimer(ex);
    }

    html += `</div>`;
  });

  html += `</div>`;
  app.innerHTML = html;

  // Scroll active card into view
  const activeCard = document.getElementById(`card-${currentExerciseIndex}`);
  if (activeCard) {
    activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function renderTimer(exercise) {
  const display = formatTime(timerSeconds || exercise.duration_seconds);
  const label = exercise.reps
    ? `${exercise.sets > 1 ? exercise.sets + '세트 × ' : ''}${exercise.reps}회`
    : '시간 유지';

  let buttons = '';
  if (!timerRunning && timerSeconds === 0) {
    buttons = `
      <button class="timer-btn btn-start" onclick="event.stopPropagation(); startTimer(${exercise.duration_seconds})">시작</button>
      <button class="timer-btn btn-skip" onclick="event.stopPropagation(); completeExercise()">건너뛰기</button>
    `;
  } else if (timerRunning) {
    buttons = `
      <button class="timer-btn btn-pause" onclick="event.stopPropagation(); pauseTimer()">일시정지</button>
      <button class="timer-btn btn-next" onclick="event.stopPropagation(); completeExercise()">완료</button>
    `;
  } else {
    buttons = `
      <button class="timer-btn btn-start" onclick="event.stopPropagation(); resumeTimer()">계속</button>
      <button class="timer-btn btn-next" onclick="event.stopPropagation(); completeExercise()">완료</button>
    `;
  }

  return `
    <div class="timer-section">
      <div class="timer-label">${label}</div>
      <div class="timer-display">${display}</div>
      <div class="timer-buttons">${buttons}</div>
    </div>
  `;
}

// =============================================
// Timer Logic
// =============================================
function startTimer(seconds) {
  timerSeconds = seconds;
  timerRunning = true;
  timerInterval = setInterval(() => {
    timerSeconds--;
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 0;
      // Vibrate if available
      if (navigator.vibrate) navigator.vibrate(200);
      completeExercise();
      return;
    }
    updateTimerDisplay();
  }, 1000);
  renderApp();
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  renderApp();
}

function resumeTimer() {
  timerRunning = true;
  timerInterval = setInterval(() => {
    timerSeconds--;
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 0;
      if (navigator.vibrate) navigator.vibrate(200);
      completeExercise();
      return;
    }
    updateTimerDisplay();
  }, 1000);
  renderApp();
}

function updateTimerDisplay() {
  const el = document.querySelector('.timer-display');
  if (el) el.textContent = formatTime(timerSeconds);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// =============================================
// Exercise Flow
// =============================================
function selectExercise(index) {
  if (completedExercises.includes(index)) return;
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  currentExerciseIndex = index;
  renderApp();
}

function completeExercise() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;

  if (!completedExercises.includes(currentExerciseIndex)) {
    completedExercises.push(currentExerciseIndex);
  }

  const exercise = program.exercises[currentExerciseIndex];
  const allDone = completedExercises.length === program.exercises.length;

  if (allDone) {
    showCompleteScreen();
    return;
  }

  // Show rest if needed, then move to next
  if (exercise.rest_seconds > 0) {
    showRest(exercise.rest_seconds, () => {
      moveToNext();
    });
  } else {
    moveToNext();
  }
}

function moveToNext() {
  // Find next incomplete exercise
  for (let i = 0; i < program.exercises.length; i++) {
    const idx = (currentExerciseIndex + 1 + i) % program.exercises.length;
    if (!completedExercises.includes(idx)) {
      currentExerciseIndex = idx;
      renderApp();
      return;
    }
  }
  // All done
  showCompleteScreen();
}

// =============================================
// Rest Timer
// =============================================
let restCallback = null;
let restInterval = null;

function showRest(seconds, callback) {
  restCallback = callback;
  const overlay = document.getElementById('restOverlay');
  const timerEl = document.getElementById('restTimer');
  overlay.classList.add('show');
  timerEl.textContent = seconds;

  let remaining = seconds;
  restInterval = setInterval(() => {
    remaining--;
    timerEl.textContent = remaining;
    if (remaining <= 0) {
      hideRest();
    }
  }, 1000);
}

function hideRest() {
  clearInterval(restInterval);
  document.getElementById('restOverlay').classList.remove('show');
  if (restCallback) {
    restCallback();
    restCallback = null;
  }
}

function skipRest() {
  hideRest();
}

// =============================================
// Complete Screen
// =============================================
function showCompleteScreen() {
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const minutes = Math.round(elapsed / 60);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="complete-screen show">
      <div class="complete-emoji">🎉</div>
      <div class="complete-title">운동 완료!</div>
      <div class="complete-sub">오늘도 수고했어요~<br>꾸준히 하는 게 제일 중요한 거예요!</div>
      <div class="complete-stats">
        <div class="stat-item">
          <div class="stat-value">${completedExercises.length}</div>
          <div class="stat-label">완료한 운동</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${minutes || 1}</div>
          <div class="stat-label">소요 시간(분)</div>
        </div>
      </div>
      <button class="complete-btn" onclick="sendResult()">결과 저장하기</button>
    </div>
  `;
}

function showRestDay() {
  document.getElementById('app').innerHTML = `
    <div class="rest-day">
      <div class="rest-day-emoji">😴</div>
      <div class="rest-day-title">오늘은 휴식일이에요</div>
      <div class="rest-day-sub">주말엔 푹 쉬세요~<br>다음 주 월요일에 만나요!</div>
    </div>
  `;
}

// =============================================
// Send Result to Bot
// =============================================
function sendResult() {
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const exerciseNames = completedExercises.map(i => program.exercises[i].name);

  const result = {
    week: program.week,
    day: program.day,
    completed_exercises: exerciseNames,
    duration_seconds: elapsed,
    total_exercises: program.exercises.length,
    completed_count: completedExercises.length,
  };

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.sendData(JSON.stringify(result));
  } else {
    // Debug mode: show result
    alert('Result: ' + JSON.stringify(result, null, 2));
  }
}

// =============================================
// Start
// =============================================
init();
</script>
</body>
</html>
