<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>운동</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ==========================================
   Design inspired by Nike Training Club
   Dark theme, bold typography, circular timer
   ========================================== */
:root {
  --bg: #000000;
  --surface: #1a1a1a;
  --surface2: #2a2a2a;
  --text: #ffffff;
  --text-secondary: #8e8e93;
  --accent: #c6ff00;
  --accent-dim: rgba(198, 255, 0, 0.15);
  --success: #00e676;
  --success-dim: rgba(0, 230, 118, 0.15);
  --danger: #ff5252;
  --warm: #ff9100;
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ========== Screens ========== */
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ========== Overview Screen ========== */
.overview {
  padding: 0 0 120px;
}

.overview-header {
  padding: 24px 20px 20px;
}

.overview-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.week-pill {
  background: var(--accent-dim);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
}

.preview-pill {
  background: rgba(255, 145, 0, 0.15);
  color: var(--warm);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
}

.overview-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 6px;
}

.overview-desc {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.overview-stats {
  display: flex;
  gap: 12px;
  padding: 0 20px;
  margin-bottom: 24px;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
}

.stat-chip .icon { font-size: 15px; }

/* Exercise list */
.exercise-list {
  padding: 0 20px;
}

.exercise-list-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.ex-item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  border: 2px solid transparent;
}

.ex-item:active { transform: scale(0.98); }

.ex-item.current {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.ex-item.done {
  opacity: 0.5;
}

.ex-num {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
  background: var(--surface2);
  color: var(--text-secondary);
}

.ex-item.current .ex-num {
  background: var(--accent);
  color: #000;
}

.ex-item.done .ex-num {
  background: var(--success-dim);
  color: var(--success);
}

.ex-body {
  flex: 1;
  min-width: 0;
}

.ex-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ex-meta {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  gap: 8px;
}

.ex-chevron {
  color: var(--text-secondary);
  font-size: 18px;
  flex-shrink: 0;
}

.ex-item.done .ex-chevron { display: none; }

/* Start button (fixed bottom) */
.start-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0));
  background: linear-gradient(transparent, var(--bg) 30%);
  z-index: 50;
}

.btn-main {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius);
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.btn-main:active { transform: scale(0.97); }

.btn-start-workout {
  background: var(--accent);
  color: #000;
}

/* ========== Active Workout Screen ========== */
.workout-screen {
  padding-bottom: 100px;
}

/* Top bar */
.workout-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
}

.btn-back {
  background: var(--surface);
  border: none;
  color: var(--text);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.workout-progress-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
}

.workout-elapsed {
  font-size: 13px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

/* Progress dots */
.progress-dots {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  margin-bottom: 24px;
}

.dot {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--surface2);
  transition: background 0.3s;
}

.dot.done { background: var(--success); }
.dot.active { background: var(--accent); }

/* Exercise detail card */
.exercise-hero {
  text-align: center;
  padding: 0 24px;
  margin-bottom: 20px;
}

.exercise-hero-name {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.3px;
  margin-bottom: 8px;
}

.exercise-hero-desc {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
  max-width: 320px;
  margin: 0 auto;
}

.exercise-tags {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}

.exercise-tag {
  background: var(--surface);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* Circular timer */
.timer-ring-container {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 24px 0;
  position: relative;
}

.timer-ring-svg {
  width: 220px;
  height: 220px;
  transform: rotate(-90deg);
}

.timer-ring-bg {
  fill: none;
  stroke: var(--surface2);
  stroke-width: 6;
}

.timer-ring-progress {
  fill: none;
  stroke: var(--accent);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.3s ease;
}

.timer-center {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.timer-time {
  font-size: 56px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  line-height: 1;
}

.timer-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
  font-weight: 600;
}

/* Workout action buttons */
.workout-actions {
  display: flex;
  gap: 12px;
  padding: 0 20px;
  margin-top: 8px;
}

.workout-actions .btn-action {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.workout-actions .btn-action:active { transform: scale(0.96); }

.btn-go {
  background: var(--accent);
  color: #000;
}

.btn-pause-action {
  background: var(--surface);
  color: var(--text);
}

.btn-done {
  background: var(--success);
  color: #000;
}

.btn-skip-action {
  background: var(--surface);
  color: var(--text-secondary);
}

/* ========== Rest Overlay ========== */
.rest-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.rest-overlay.show { display: flex; }

.rest-label {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.rest-countdown {
  font-size: 96px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.rest-next-label {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 24px;
}

.rest-next-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-top: 4px;
}

.rest-skip-btn {
  margin-top: 32px;
  background: var(--surface);
  border: none;
  color: var(--text-secondary);
  padding: 12px 32px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

/* ========== Complete Screen ========== */
.complete-screen {
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
}

.complete-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--success-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  margin-bottom: 24px;
}

.complete-title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
}

.complete-subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 32px;
}

.complete-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 300px;
  margin-bottom: 40px;
}

.complete-stat {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px 16px;
  text-align: center;
}

.complete-stat-value {
  font-size: 32px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}

.complete-stat-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
  font-weight: 600;
}

.btn-complete {
  background: var(--accent);
  color: #000;
  width: 100%;
  max-width: 300px;
}

/* ========== Rest Day Screen ========== */
.rest-day-screen {
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
}

.rest-day-icon {
  font-size: 80px;
  margin-bottom: 24px;
}

.rest-day-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 8px;
}

.rest-day-sub {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* ========== Animations ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.screen.active { animation: fadeIn 0.3s ease; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

.timer-ring-container.running .timer-time {
  animation: pulse 2s ease-in-out infinite;
}

  /* 운동 일러스트 */
  .ex-thumb {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    flex-shrink: 0;
    background: var(--surface2);
    overflow: hidden;
  }

  .ex-img-wrap {
    position: relative;
    width: 100%;
    max-width: 280px;
    margin: 0 auto 16px;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    aspect-ratio: 1;
  }

  .exercise-visual {
    width: 100%;
    height: 100%;
    display: block;
  }

  .exercise-visual .move-arrow,
  .exercise-visual .focus-ring {
    animation: visualPulse 1.6s ease-in-out infinite;
  }

  .exercise-visual .pose-b {
    animation: poseHint 2.4s ease-in-out infinite;
  }

  @keyframes visualPulse {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); }
  }

  @keyframes poseHint {
    0%, 45% { opacity: 0; }
    55%, 90% { opacity: 0.55; }
    100% { opacity: 0; }
  }

  .ex-img-wrap.paused .move-arrow,
  .ex-img-wrap.paused .focus-ring,
  .ex-img-wrap.paused .pose-b {
    animation-play-state: paused;
  }

/* ========== Course Picker Screen ========== */
.courses-screen { padding: 0 0 40px; }
.courses-header { padding: 24px 20px 16px; }
.courses-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
.courses-header p { font-size: 14px; color: var(--text-secondary); }

.today-card {
  margin: 0 20px 24px;
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  border: 2px solid var(--accent-dim);
  transition: transform 0.1s;
}
.today-card:active { transform: scale(0.98); }
.today-card-label { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.today-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.today-card p { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
.today-card-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); font-weight: 600; }

.cat-section { margin-bottom: 20px; }
.cat-title { padding: 0 20px; font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }

.course-card {
  flex: 0 0 200px;
  scroll-snap-align: start;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: transform 0.1s;
}
.course-card:active { transform: scale(0.97); }
.course-card-icon { font-size: 28px; margin-bottom: 8px; }
.course-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.course-card p { font-size: 12px; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.course-card-meta { display: flex; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-secondary); font-weight: 600; }
.level-dot { display: inline-flex; gap: 2px; }
.level-dot span { width: 6px; height: 6px; border-radius: 50%; background: var(--surface2); }
.level-dot span.on { background: var(--accent); }

.btn-browse-courses {
  display: block;
  margin: 16px 20px 0;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--surface2);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}
.btn-browse-courses:active { opacity: 0.7; }

</style>
</head>
<body>

<!-- Screen 0: Course Picker -->
<div class="screen courses-screen" id="screenCourses"></div>

<!-- Screen 1: Overview -->
<div class="screen overview" id="screenOverview"></div>

<!-- Screen 2: Active Workout -->
<div class="screen workout-screen" id="screenWorkout"></div>

<!-- Screen 3: Complete -->
<div class="screen complete-screen" id="screenComplete"></div>

<!-- Screen 4: Rest Day -->
<div class="screen rest-day-screen" id="screenRestDay"></div>

<!-- Rest Overlay -->
<div class="rest-overlay" id="restOverlay">
  <div class="rest-label">REST</div>
  <div class="rest-countdown" id="restCountdown">15</div>
  <div class="rest-next-label">다음 운동</div>
  <div class="rest-next-name" id="restNextName">-</div>
  <button class="rest-skip-btn" onclick="skipRest()">건너뛰기</button>
</div>

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[c]));
}

function getExerciseVisualSpec(name) {
  const normalize = (value) => String(value)
    .replace(/\s+/g, '')
    .replace(/[()&+]/g, '')
    .replace(/-/g, '')
    .toLowerCase();

  const compactName = normalize(name);
  for (const rule of VISUAL_RULES) {
    if (rule.keys.some((key) => {
      const compactKey = normalize(key);
      return compactName.includes(compactKey);
    })) {
      return rule;
    }
  }
  return { ...DEFAULT_VISUAL };
}

        ${arrowPath('M146 127 C163 124, 179 129, 196 136')}`;
  }
}

function renderExerciseVisual(name, mode = 'hero', isMoving = false) {
  const spec = getExerciseVisualSpec(name);
  const safeName = escapeHtml(name);
  const safeLabel = escapeHtml(spec.label);
  const cue = escapeHtml(spec.cue);
  const line1 = cue.slice(0, 18);
  const line2 = cue.length > 18 ? cue.slice(18, 36) : '';
  const labelText = mode === 'thumb' ? '' : `
    <text x="140" y="34" text-anchor="middle" fill="var(--text)" font-size="17" font-weight="800">${safeLabel}</text>
    <text x="140" y="248" text-anchor="middle" fill="var(--text-secondary)" font-size="12" font-weight="700">${line1}</text>
    ${line2 ? `<text x="140" y="265" text-anchor="middle" fill="var(--text-secondary)" font-size="12" font-weight="700">${line2}</text>` : ''}
  `;
  const paused = mode === 'hero' && !isMoving ? ' paused' : '';
  const svg = exerciseSvg(safeName, labelText, drawPose(spec.pose));

  if (mode === 'thumb') {
    return `<div class="ex-thumb">${svg}</div>`;
  }
  return `<div class="ex-img-wrap${paused}">${svg}</div>`;
}

function exerciseSvg(safeName, labelText, poseMarkup) {
  return `
    <svg class="exercise-visual" viewBox="0 0 280 280" role="img" aria-label="${safeName} 동작 안내" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L7,3 z" fill="var(--accent)"/>
        </marker>
      </defs>
      <rect x="0" y="0" width="280" height="280" fill="var(--surface)"/>
      <circle cx="224" cy="54" r="30" fill="var(--accent-dim)"/>
      ${labelText}
      ${poseMarkup}
    </svg>`;
}

function getPrograms() {
  return PROGRAMS || null;
}

function getCurrentWeekDay() {
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  const week = ((weekNo - 1) % 4) + 1;
  const day = now.getDay() === 0 ? 7 : now.getDay();
  return { week, day };
}

// =============================================
// App State
// =============================================
let currentExerciseIndex = 0;
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;
let completedExercises = [];
let startTime = null;
let program = null;
let isPreview = false;
let elapsedInterval = null;
let isCourseMode = false;
let dailyProgram = null;

const WEEK_THEMES = {
  1: '기초 회복',
  2: '코어 활성화',
  3: '근력 강화',
  4: '전신 통합',
};

// =============================================
// Initialize
// =============================================
function applyTheme() {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.colorScheme === 'light') {
      document.documentElement.style.setProperty('--bg', '#f2f2f7');
      document.documentElement.style.setProperty('--surface', '#ffffff');
      document.documentElement.style.setProperty('--surface2', '#e5e5ea');
      document.documentElement.style.setProperty('--text', '#000000');
      document.documentElement.style.setProperty('--text-secondary', '#8e8e93');
      document.documentElement.style.setProperty('--accent', '#5856d6');
      document.documentElement.style.setProperty('--accent-dim', 'rgba(88,86,214,0.12)');
      document.documentElement.style.setProperty('--success', '#34c759');
      document.documentElement.style.setProperty('--success-dim', 'rgba(52,199,89,0.12)');
    }
  }
}

function loadDailyProgram() {
  const { week, day } = getCurrentWeekDay();
  const params = new URLSearchParams(window.location.search);
  let paramWeek = parseInt(params.get('week')) || week;
  let paramDay = parseInt(params.get('day')) || day;

  isPreview = false;
  if (paramDay > 5 && !params.get('day')) {
    paramDay = 1;
    paramWeek = (week % 4) + 1;
    isPreview = true;
  }

  const programs = getPrograms();
  const wk = String(paramWeek);
  const dy = String(paramDay);
  if (programs && programs[wk] && programs[wk][dy]) {
    dailyProgram = { ...programs[wk][dy], week: paramWeek, day: paramDay };
  } else {
    dailyProgram = getFallbackProgram(paramWeek, paramDay);
  }
  return dailyProgram;
}

function init() {
  applyTheme();
  loadDailyProgram();
  renderCourses();
}

// =============================================
// Screen: Course Picker
// =============================================
function renderCourses() {
  showScreen('screenCourses');
  const el = document.getElementById('screenCourses');
  const dp = dailyProgram;
  const weekTheme = WEEK_THEMES[dp.week] || '';

  let html = `
    <div class="courses-header">
      <h1>오늘의 운동</h1>
      <p>원하는 코스를 골라보세요</p>
    </div>

    <div class="today-card" onclick="selectDailyProgram()">
      <div class="today-card-label">${isPreview ? '🔮 미리보기' : '⭐ 오늘의 추천'} · ${dp.week}주차 ${weekTheme}</div>
      <h2>${dp.title}</h2>
      <p>${dp.description}</p>
      <div class="today-card-meta">
        <span>⏱ ${dp.duration_minutes}분</span>
        <span>🔥 ${dp.exercises.length}개 동작</span>
      </div>
    </div>
  `;

  // Group courses by category
  const catOrder = ['core', 'back', 'thoracic', 'pelvic', 'relax'];
  for (const catKey of catOrder) {
    const cat = COURSE_CATEGORIES[catKey];
    if (!cat) continue;
    const catCourses = COURSES.filter(c => c.category === catKey);
    if (catCourses.length === 0) continue;

    html += `<div class="cat-section">
      <div class="cat-title">${cat.icon} ${cat.label}</div>
      <div class="cat-scroll">`;

    for (const course of catCourses) {
      const levelDots = Array.from({length: 3}, (_, i) =>
        `<span class="${i < course.level ? 'on' : ''}"></span>`
      ).join('');

      html += `
        <div class="course-card" onclick="selectCourse('${course.id}')">
          <div class="course-card-icon">${course.icon}</div>
          <h3>${course.title}</h3>
          <p>${course.description}</p>
          <div class="course-card-meta">
            <span>⏱ ${course.duration_minutes}분</span>
            <span class="level-dot">${levelDots}</span>
          </div>
        </div>`;
    }

    html += `</div></div>`;
  }

  el.innerHTML = html;
}

function selectDailyProgram() {
  isCourseMode = false;
  program = { ...dailyProgram };
  renderOverview();
}

function selectCourse(courseId) {
  const course = COURSES.find(c => c.id === courseId);
  if (!course) return;
  isCourseMode = true;
  program = { ...course, week: 0, day: 0 };
  isPreview = false;
  renderOverview();
}

function getFallbackProgram(week, day) {
  const dayNames = { 1: '월', 2: '화', 3: '수', 4: '목', 5: '금' };
  return {
    week, day,
    title: `${week}주차 ${dayNames[day] || ''}요일 운동`,
    description: '오늘의 운동을 시작해볼까요?',
    duration_minutes: 15,
    exercises: [
      { name: '스트레칭', duration_seconds: 120, sets: 1, reps: null, description: '전신을 부드럽게 풀어주세요', rest_seconds: 10 },
      { name: '스쿼트', duration_seconds: 90, sets: 2, reps: 10, description: '천천히 내려갔다 올라오세요', rest_seconds: 15 },
      { name: '브릿지', duration_seconds: 90, sets: 2, reps: 10, description: '엉덩이를 들어올려주세요', rest_seconds: 15 },
      { name: '플랭크', duration_seconds: 60, sets: 2, reps: null, description: '20초 유지해주세요', rest_seconds: 10 },
      { name: '쿨다운', duration_seconds: 120, sets: 1, reps: null, description: '깊은 호흡으로 마무리', rest_seconds: 0 },
    ]
  };
}

// =============================================
// Screen: Overview
// =============================================
function renderOverview() {
  showScreen('screenOverview');
  const el = document.getElementById('screenOverview');
  const total = program.exercises.length;
  const weekTheme = WEEK_THEMES[program.week] || '';

  const metaLabel = isCourseMode
    ? `<span class="week-pill">${program.icon || '📋'} 코스</span>`
    : `<span class="week-pill">${program.week}주차 · ${weekTheme}</span>${isPreview ? '<span class="preview-pill">미리보기</span>' : ''}`;

  let html = `
    <div class="overview">
      <div class="overview-header">
        <div class="overview-meta" style="justify-content:space-between;">
          <div style="display:flex;gap:8px;align-items:center;">${metaLabel}</div>
          <button class="btn-back" onclick="renderCourses()" style="width:32px;height:32px;font-size:16px;">‹</button>
        </div>
        <h1 class="overview-title">${program.title}</h1>
        <p class="overview-desc">${program.description}</p>
      </div>

      <div class="overview-stats">
        <div class="stat-chip"><span class="icon">⏱</span> ${program.duration_minutes}분</div>
        <div class="stat-chip"><span class="icon">🔥</span> ${total}개 동작</div>
      </div>

      <div class="exercise-list">
        <div class="exercise-list-title">운동 목록</div>
  `;

  program.exercises.forEach((ex, i) => {
    const metaParts = [];
    if (ex.sets > 1) metaParts.push(`${ex.sets}세트`);
    if (ex.reps) metaParts.push(`${ex.reps}회`);
    metaParts.push(`${ex.duration_seconds}초`);

    html += `
      <div class="ex-item" onclick="jumpToExercise(${i})">
        ${renderExerciseVisual(ex.name, 'thumb')}
        <div class="ex-num">${i + 1}</div>
        <div class="ex-body">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${metaParts.join(' · ')}</div>
        </div>
        <div class="ex-chevron">›</div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
    <div class="start-bar">
      <button class="btn-main btn-start-workout" onclick="startWorkout()">
        ${isPreview ? '미리보기' : '운동 시작하기'}
      </button>
    </div>
  `;

  el.innerHTML = html;
}

// =============================================
// Screen: Active Workout
// =============================================
function startWorkout() {
  startTime = Date.now();
  currentExerciseIndex = 0;
  completedExercises = [];
  timerSeconds = 0;
  timerRunning = false;

  // Start elapsed timer
  if (elapsedInterval) clearInterval(elapsedInterval);
  elapsedInterval = setInterval(updateElapsed, 1000);

  renderWorkout();
}

function jumpToExercise(index) {
  if (!startTime) {
    startTime = Date.now();
    completedExercises = [];
    if (elapsedInterval) clearInterval(elapsedInterval);
    elapsedInterval = setInterval(updateElapsed, 1000);
  }
  currentExerciseIndex = index;
  timerSeconds = 0;
  timerRunning = false;
  clearInterval(timerInterval);
  renderWorkout();
}

function renderWorkout() {
  showScreen('screenWorkout');
  const el = document.getElementById('screenWorkout');
  const ex = program.exercises[currentExerciseIndex];
  const total = program.exercises.length;
  const elapsed = startTime ? Math.round((Date.now() - startTime) / 1000) : 0;

  const tags = [];
  if (ex.sets > 1) tags.push(`${ex.sets}세트`);
  if (ex.reps) tags.push(`${ex.reps}회`);
  tags.push(`${ex.duration_seconds}초`);

  // Timer display
  const displaySec = timerSeconds || ex.duration_seconds;
  const maxSec = ex.duration_seconds;
  const circumference = 2 * Math.PI * 100;
  const progress = timerSeconds > 0 ? (1 - timerSeconds / maxSec) : 0;
  const dashOffset = circumference * (1 - progress);

  // Progress dots
  let dotsHtml = '';
  for (let i = 0; i < total; i++) {
    const cls = completedExercises.includes(i) ? 'done' : i === currentExerciseIndex ? 'active' : '';
    dotsHtml += `<div class="dot ${cls}"></div>`;
  }

  // Action buttons
  let actionsHtml = '';
  if (!timerRunning && timerSeconds === 0) {
    actionsHtml = `
      <button class="btn-action btn-go" onclick="startTimer(${ex.duration_seconds})">시작</button>
      <button class="btn-action btn-skip-action" onclick="completeExercise()">건너뛰기</button>
    `;
  } else if (timerRunning) {
    actionsHtml = `
      <button class="btn-action btn-pause-action" onclick="pauseTimer()">일시정지</button>
      <button class="btn-action btn-done" onclick="completeExercise()">완료</button>
    `;
  } else {
    actionsHtml = `
      <button class="btn-action btn-go" onclick="resumeTimer()">계속</button>
      <button class="btn-action btn-done" onclick="completeExercise()">완료</button>
    `;
  }

  const timerLabel = ex.reps
    ? `${ex.sets > 1 ? ex.sets + '세트 × ' : ''}${ex.reps}회`
    : '시간 유지';

  el.innerHTML = `
    <div class="workout-topbar">
      <button class="btn-back" onclick="goBack()">‹</button>
      <span class="workout-progress-text">${currentExerciseIndex + 1} / ${total}</span>
      <span class="workout-elapsed" id="elapsedDisplay">${formatTime(elapsed)}</span>
    </div>

    <div class="progress-dots">${dotsHtml}</div>

    <div class="exercise-hero">
      ${renderExerciseVisual(ex.name, 'hero', timerRunning)}
      <h2 class="exercise-hero-name">${ex.name}</h2>
      <p class="exercise-hero-desc">${ex.description}</p>
      <div class="exercise-tags">
        ${tags.map(t => `<span class="exercise-tag">${t}</span>`).join('')}
      </div>
    </div>

    <div class="timer-ring-container ${timerRunning ? 'running' : ''}" id="timerContainer">
      <svg class="timer-ring-svg" viewBox="0 0 220 220">
        <circle class="timer-ring-bg" cx="110" cy="110" r="100"/>
        <circle class="timer-ring-progress" id="timerRing" cx="110" cy="110" r="100"
          stroke-dasharray="${circumference}"
          stroke-dashoffset="${dashOffset}"/>
      </svg>
      <div class="timer-center">
        <div class="timer-time" id="timerDisplay">${formatTime(displaySec)}</div>
        <div class="timer-sub">${timerLabel}</div>
      </div>
    </div>

    <div class="workout-actions">${actionsHtml}</div>
  `;
}

function goBack() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  renderOverviewWithProgress();
}

function renderOverviewWithProgress() {
  showScreen('screenOverview');
  const el = document.getElementById('screenOverview');
  const total = program.exercises.length;
  const weekTheme = WEEK_THEMES[program.week] || '';

  const metaLabel = isCourseMode
    ? `<span class="week-pill">${program.icon || '📋'} 코스</span>`
    : `<span class="week-pill">${program.week}주차 · ${weekTheme}</span>`;

  let html = `
    <div class="overview">
      <div class="overview-header">
        <div class="overview-meta">
          ${metaLabel}
        </div>
        <h1 class="overview-title">${program.title}</h1>
        <p class="overview-desc">${program.description}</p>
      </div>

      <div class="overview-stats">
        <div class="stat-chip"><span class="icon">⏱</span> ${program.duration_minutes}분</div>
        <div class="stat-chip"><span class="icon">✅</span> ${completedExercises.length}/${total} 완료</div>
      </div>

      <div class="exercise-list">
        <div class="exercise-list-title">운동 목록</div>
  `;

  program.exercises.forEach((ex, i) => {
    const isDone = completedExercises.includes(i);
    const isCurrent = i === currentExerciseIndex && !isDone;
    const cls = isDone ? 'done' : isCurrent ? 'current' : '';

    const metaParts = [];
    if (ex.sets > 1) metaParts.push(`${ex.sets}세트`);
    if (ex.reps) metaParts.push(`${ex.reps}회`);
    metaParts.push(`${ex.duration_seconds}초`);

    html += `
      <div class="ex-item ${cls}" onclick="${isDone ? '' : `jumpToExercise(${i})`}">
        ${renderExerciseVisual(ex.name, 'thumb')}
        <div class="ex-num">${isDone ? '✓' : i + 1}</div>
        <div class="ex-body">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${metaParts.join(' · ')}</div>
        </div>
        ${isDone ? '' : '<div class="ex-chevron">›</div>'}
      </div>
    `;
  });

  const allDone = completedExercises.length === total;
  const btnLabel = allDone ? '결과 저장하기' : '계속하기';
  const btnAction = allDone ? 'showCompleteScreen()' : `jumpToExercise(${currentExerciseIndex})`;

  html += `
      </div>
    </div>
    <div class="start-bar">
      <button class="btn-main btn-start-workout" onclick="${btnAction}">
        ${btnLabel}
      </button>
    </div>
  `;

  el.innerHTML = html;
}

// =============================================
// Timer
// =============================================
function startTimer(seconds) {
  timerSeconds = seconds;
  timerRunning = true;
  renderWorkout();
  timerInterval = setInterval(timerTick, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  renderWorkout();
}

function resumeTimer() {
  timerRunning = true;
  renderWorkout();
  timerInterval = setInterval(timerTick, 1000);
}

function timerTick() {
  timerSeconds--;
  if (timerSeconds <= 0) {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 0;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    completeExercise();
    return;
  }
  // Update display without full re-render
  const display = document.getElementById('timerDisplay');
  const ring = document.getElementById('timerRing');
  if (display) display.textContent = formatTime(timerSeconds);
  if (ring) {
    const ex = program.exercises[currentExerciseIndex];
    const circumference = 2 * Math.PI * 100;
    const progress = 1 - timerSeconds / ex.duration_seconds;
    ring.setAttribute('stroke-dashoffset', circumference * (1 - progress));
  }
}

function updateElapsed() {
  const el = document.getElementById('elapsedDisplay');
  if (el && startTime) {
    const elapsed = Math.round((Date.now() - startTime) / 1000);
    el.textContent = formatTime(elapsed);
  }
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// =============================================
// Exercise Flow
// =============================================
function completeExercise() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;

  if (!completedExercises.includes(currentExerciseIndex)) {
    completedExercises.push(currentExerciseIndex);
  }

  const allDone = completedExercises.length === program.exercises.length;
  if (allDone) {
    clearInterval(elapsedInterval);
    showCompleteScreen();
    return;
  }

  const exercise = program.exercises[currentExerciseIndex];
  if (exercise.rest_seconds > 0) {
    showRest(exercise.rest_seconds, moveToNext);
  } else {
    moveToNext();
  }
}

function moveToNext() {
  const total = program.exercises.length;
  for (let i = 0; i < total; i++) {
    const idx = (currentExerciseIndex + 1 + i) % total;
    if (!completedExercises.includes(idx)) {
      currentExerciseIndex = idx;
      renderWorkout();
      return;
    }
  }
  clearInterval(elapsedInterval);
  showCompleteScreen();
}

// =============================================
// Rest Overlay
// =============================================
let restCallback = null;
let restInterval = null;

function showRest(seconds, callback) {
  restCallback = callback;
  const overlay = document.getElementById('restOverlay');
  const countdown = document.getElementById('restCountdown');
  const nextName = document.getElementById('restNextName');
  overlay.classList.add('show');
  countdown.textContent = seconds;

  // Show next exercise name
  const total = program.exercises.length;
  for (let i = 0; i < total; i++) {
    const idx = (currentExerciseIndex + 1 + i) % total;
    if (!completedExercises.includes(idx)) {
      nextName.textContent = program.exercises[idx].name;
      break;
    }
  }

  let remaining = seconds;
  restInterval = setInterval(() => {
    remaining--;
    countdown.textContent = remaining;
    if (remaining <= 0) hideRest();
  }, 1000);
}

function hideRest() {
  clearInterval(restInterval);
  document.getElementById('restOverlay').classList.remove('show');
  if (restCallback) { restCallback(); restCallback = null; }
}

function skipRest() { hideRest(); }

// =============================================
// Complete Screen
// =============================================
function showCompleteScreen() {
  showScreen('screenComplete');
  const el = document.getElementById('screenComplete');
  const elapsed = startTime ? Math.round((Date.now() - startTime) / 1000) : 0;
  const minutes = Math.max(1, Math.round(elapsed / 60));

  el.innerHTML = `
    <div class="complete-icon">✓</div>
    <h2 class="complete-title">운동 완료!</h2>
    <p class="complete-subtitle">오늘도 수고했어요!<br>꾸준히 하는 게 제일 중요한 거예요</p>

    <div class="complete-stats-grid">
      <div class="complete-stat">
        <div class="complete-stat-value">${completedExercises.length}</div>
        <div class="complete-stat-label">완료한 운동</div>
      </div>
      <div class="complete-stat">
        <div class="complete-stat-value">${minutes}</div>
        <div class="complete-stat-label">소요 시간(분)</div>
      </div>
    </div>

    <button class="btn-main btn-complete" onclick="sendResult()">결과 저장하기</button>
  `;
}

// =============================================
// Send Result
// =============================================
function sendResult() {
  const elapsed = startTime ? Math.round((Date.now() - startTime) / 1000) : 0;
  const exerciseNames = completedExercises.map(i => program.exercises[i].name);

  const result = {
    mode: isCourseMode ? 'course' : 'daily',
    week: program.week,
    day: program.day,
    completed_exercises: exerciseNames,
    duration_seconds: elapsed,
    total_exercises: program.exercises.length,
    completed_count: completedExercises.length,
  };
  if (isCourseMode && program.id) {
    result.course_id = program.id;
    result.course_title = program.title;
  }

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.sendData(JSON.stringify(result));
  } else {
    alert('Result: ' + JSON.stringify(result, null, 2));
  }
}

// =============================================
// Helpers
// =============================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// =============================================
// Start
// =============================================
init();
</script>
